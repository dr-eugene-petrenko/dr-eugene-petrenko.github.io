<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;color:#3f3936;background:#fffaf8}
.w{max-width:960px;margin:0 auto;padding:24px 16px 50px}
.hero{border-radius:22px;padding:26px 24px;text-align:center;background:linear-gradient(135deg,#fff1ec,#e6f6f4)}
.hero h1{margin:0 0 8px;font-size:30px;color:#4a3b37}.hero p{margin:0 auto;max-width:660px;line-height:1.6;font-size:16.5px}
.tabs{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.tab{border:2px solid var(--c);background:#fff;color:var(--c);font:700 16px inherit;font-family:inherit;border-radius:999px;padding:10px 20px;cursor:pointer}
.tab.on{background:var(--c);color:#fff}
.pat{--c:#e8836f;--d:#c1563f;--bg:#fff3ef;--b:#f6d3c8}.doc{--c:#3aa6a0;--d:#1f7a75;--bg:#eaf7f6;--b:#bfe5e2}
.panel{background:var(--bg);border-top:6px solid var(--c);border-radius:20px;padding:18px 18px 22px;margin-top:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 260px;font-size:16px;padding:11px 14px;border:1px solid var(--b);border-radius:12px;font-family:inherit;background:#fff}
.ask{font:700 15.5px inherit;font-family:inherit;color:#fff;background:var(--c);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.chip{border:1px solid var(--b);background:#fff;color:var(--d);border-radius:999px;padding:6px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.cnt{font-size:13.5px;color:#7a6c68;margin:8px 2px}
details{background:#fff;border-radius:14px;margin:0 0 9px;border:1px solid var(--b);box-shadow:0 2px 8px rgba(0,0,0,.03)}
summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:15.5px;list-style:none;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
summary::-webkit-details-marker{display:none}summary:before{content:'+';flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;margin-top:1px}
details[open] summary:before{content:'–'}
.meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 6px 48px}
.tag{font-size:12px;font-weight:700;color:var(--d);background:var(--bg);border-radius:999px;padding:2px 9px}.tag.new{background:#fff4d6;color:#9a6a00}
.ans{padding:2px 16px 14px 48px;line-height:1.62;font-size:15px;white-space:pre-line}.ans .src{display:block;margin-top:6px;font-size:13px;color:#857873}
.empty{background:#fff;border-radius:14px;padding:16px;text-align:center;color:#7a6c68}
.form{display:none;background:#fff;border-radius:18px;padding:18px;margin:14px 0 6px;border:2px solid var(--c)}.form.show{display:block}
.form h3{margin:0 0 4px;color:var(--d)}.form .warn{background:#fff0ee;border-left:4px solid #e05a45;border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.5;margin:10px 0}
.form label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}.form select,.form textarea,.form input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--b);border-radius:10px;font-family:inherit}
.form textarea{min-height:110px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.row2{grid-template-columns:1fr}}
.agree{display:flex!important;gap:10px;align-items:flex-start;font-weight:500!important;line-height:1.45}.agree input{width:20px;height:20px;flex:none;accent-color:var(--c);margin-top:1px}
.send{margin-top:14px}.ok{display:none;background:#eef9ee;border:1px solid #9fd39f;border-radius:12px;padding:12px 14px;margin-top:12px;line-height:1.5}.err{color:#c0392b;font-size:14px;margin-top:8px}
.small{font-size:13px;color:#7a6c68;margin-top:8px}.small a{color:var(--d)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0 0}.how div{background:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45;border:1px solid #eee}.how b{display:block;font-size:22px;margin-bottom:2px}
.cb{margin:26px 0 8px;padding:18px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.05)}.cb a{display:inline-block;margin:5px;text-decoration:none;color:#fff;font-weight:700;border-radius:999px;padding:9px 16px}
.foot{font-size:12.5px;color:#857873;line-height:1.5;margin-top:14px;text-align:center}
</style>
