<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;color:#3a3433;background:#fffdfc}.w{max-width:1100px;margin:0 auto;padding:28px 18px 60px}h1{font-size:34px;color:#4a3b37;margin-bottom:6px}.lead{font-size:17px;color:#6b5f5c;margin-bottom:18px}.nav{position:sticky;top:0;z-index:5;background:rgba(255,253,252,.95);backdrop-filter:blur(6px);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid #f0e6e3;margin-bottom:10px}.chip{text-decoration:none;color:#fff;background:var(--c);padding:8px 14px;border-radius:20px;font-weight:600;font-size:15px}.chip span{background:rgba(255,255,255,.3);border-radius:10px;padding:1px 7px;margin-left:4px;font-size:13px}section{background:var(--bg);border-top:6px solid var(--c);border-radius:18px;padding:20px 20px 24px;margin-top:26px;scroll-margin-top:70px}.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}h2{font-size:26px;color:var(--c)}.cnt{font-size:14px;color:#8a7d79}.sd{color:#6b5f5c;margin:4px 0 16px;font-size:16px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}figure{position:relative;border-radius:14px;overflow:hidden;cursor:zoom-in;background:#ddd;aspect-ratio:4/5;box-shadow:0 3px 12px rgba(0,0,0,.08)}figure img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}figure:hover img{transform:scale(1.04)}figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;color:#fff;font-size:14px;line-height:1.35;background:linear-gradient(transparent,rgba(0,0,0,.72))}figcaption i{display:block;font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffe2d9;margin-bottom:2px}#lb{position:fixed;inset:0;background:rgba(20,16,15,.94);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}#lb.on{display:flex}#lb img{max-width:94vw;max-height:78vh;border-radius:10px;object-fit:contain}#lb .t{color:#fff;margin-top:14px;font-size:17px;text-align:center;max-width:90vw}#lb .t i{display:inline-block;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;border-radius:12px;padding:3px 10px;margin-right:8px}#lb button{position:absolute;border:0;background:rgba(255,255,255,.9);color:#4a3b37;width:46px;height:46px;border-radius:50%;font-size:26px;cursor:pointer}#lb .x{top:16px;right:16px}#lb .pv{left:14px;top:50%}#lb .nx{right:14px;top:50%}#lb .k{position:absolute;top:24px;left:20px;color:#ccc;font-size:14px}@media(max-width:600px){h1{font-size:27px}.g{grid-template-columns:repeat(2,1fr);gap:8px}figcaption{font-size:12px;padding:20px 8px 8px}section{padding:16px 12px 18px}h2{font-size:22px}}</style>
